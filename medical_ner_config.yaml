# === NER MODEL CONFIGURATION ===
model:
  # Use spaCy Spanish model
  spacy_model: "es_core_news_md"  # Medium Spanish model
  # Alternative: "es_core_news_lg" for large model (better accuracy, more memory)

  # Use transformers model (optional, for better medical entity recognition)
  transformers_model: null  # Can use "PlanTL-GOB-ES/roberta-base-biomedical-es" for Spanish medical

  # Enable rule-based matching
  use_rules: true

  # Enable pattern matching
  use_patterns: true

  # Combine NER + patterns
  hybrid_mode: true

# === EXTRACTION SETTINGS ===
extraction:
  # Minimum confidence score to include entity
  min_confidence: 0.5

  # Maximum entities per type (prevent over-extraction)
  max_entities_per_type: 50

  # Include entity positions in original text
  include_positions: true

  # Include surrounding context (words before/after entity)
  include_context: true
  context_window: 5  # words before/after

  # Validate extracted entities
  validate_entities: true

  # Normalize entity text (lowercase, remove accents for matching)
  normalize: false  # Keep original for medical terms

  # Merge overlapping entities
  merge_overlapping: true

# === VALIDATION RULES ===
validation:
  # Dose validation
  dosis:
    min_value: 0.01
    max_value: 10000  # mg
    valid_units: ["mg", "g", "ml", "mcg", "UI", "u", "unidades"]

  # Vital signs ranges
  signos_vitales:
    presion_arterial_sistolica:
      min: 60
      max: 250
    presion_arterial_diastolica:
      min: 40
      max: 150
    frecuencia_cardiaca:
      min: 30
      max: 200
    temperatura:
      min: 34.0
      max: 42.0
    frecuencia_respiratoria:
      min: 8
      max: 60
    saturacion_oxigeno:
      min: 50
      max: 100

# === OUTPUT FORMAT ===
output:
  # JSON structure for extracted entities
  format: "structured"  # structured, flat, nested

  # Include metadata
  include_metadata: true
  metadata_fields:
    - extraction_timestamp
    - confidence_scores
    - entity_positions
    - validation_status

  # Group entities by type
  group_by_type: true

  # Sort entities by confidence
  sort_by_confidence: true

# === PERFORMANCE ===
performance:
  # Batch size for processing multiple documents
  batch_size: 10

  # Use GPU for transformers model
  use_gpu: true

  # Number of threads for spaCy pipeline
  n_threads: 4

  # Enable caching for repeated extractions
  enable_cache: true

# === SPANISH LANGUAGE SPECIFIC ===
spanish:
  # Month names for date parsing
  meses:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    setiembre: 9  # Common variant in Peru
    octubre: 10
    noviembre: 11
    diciembre: 12

  # Stop words to filter out
  stop_words:
    - "el"
    - "la"
    - "de"
    - "del"
    - "al"
    - "con"
    - "sin"
    - "por"
    - "para"

# === ADVANCED FEATURES (Future) ===
advanced:
  # Extract relationships between entities
  extract_relationships: false

  # Resolve entity coreferences (e.g., "el paciente" -> name)
  resolve_coreference: false

  # Link to medical ontologies (SNOMED-CT, ICD-10)
  link_ontologies: false

  # Infer missing information
  infer_missing: false
